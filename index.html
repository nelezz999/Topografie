<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topoheld Nederland</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1565c0">
</head>

<body>

<header>

    <h1>🌍 Topoheld Nederland</h1>

    <p>Kies wat je wilt oefenen</p>

</header>

<main>

    <section class="selectors">

        <button class="category-btn" data-category="provinces">
            Provincies
        </button>

        <button class="category-btn" data-category="capitals">
            Hoofdsteden
        </button>

        <button class="category-btn" data-category="rivers">
            Rivieren
        </button>

        <button class="category-btn" data-category="waters">
            Wateren
        </button>

        <button class="category-btn" data-category="polders">
            Polders
        </button>

        <button class="category-btn" data-category="flevoland">
            Flevoland
        </button>

        <button class="category-btn" data-category="zeeland">
            Zeeland
        </button>

        <button class="category-btn" data-category="special">
            Schiphol & Deltawerken
        </button>

    </section>

    <section class="game-card">

        <div id="score">

            Score: 0

        </div>

        <h2 id="question">

            Kies eerst een onderwerp

        </h2>

        <div id="answers">

        </div>

    </section>

</main>

<footer>

    <small>Topoheld Nederland © 2026</small>

</footer>

<script type="module" src="app.js"></script>

</body>

</html>
